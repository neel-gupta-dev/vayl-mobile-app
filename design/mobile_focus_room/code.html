<body class="font-body selection:bg-primary/30">
<!-- Top Navigation Bar (Shared Component: TopAppBar) -->
<header class="fixed top-0 w-full z-50 bg-[#0b0e11] dark:bg-[#0b0e11] flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:bg-slate-800/50 transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-xl font-bold tracking-tighter text-slate-100 font-headline">Knowledge Vault</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-slate-400 hover:bg-slate-800/50 transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Deep Focus Palette) -->
<main class="min-h-screen pt-16 pb-32 flex flex-col items-center justify-center relative overflow-hidden px-6">
<!-- Subtle Background Aesthetic -->
<div class="absolute inset-0 focus-glow pointer-events-none"></div>
<!-- Context Header -->
<div class="text-center mb-12 relative z-10">
<p class="font-label text-xs tracking-[0.2em] text-on-surface-variant mb-2">CURRENT SESSION</p>
<h2 class="font-headline font-bold text-2xl text-on-surface">Deep Work Phase</h2>
</div>
<!-- Large Minimalist Countdown Timer -->
<div class="relative flex items-center justify-center w-full max-w-xs aspect-square mb-16">
<!-- Decorative Progress Ring (Subtle) -->
<svg class="absolute inset-0 w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-variant" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-width="0.5"></circle>
<circle class="text-primary/40" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301.59" stroke-dashoffset="75" stroke-width="1.5"></circle>
</svg>
<div class="text-center">
<span class="block font-headline font-extrabold text-7xl md:text-8xl tracking-tighter text-on-surface leading-none">
                    25:00
                </span>
<span class="block font-label text-sm text-on-surface-variant mt-4 tracking-widest">MINUTES LEFT</span>
</div>
</div>
<!-- Action Controls -->
<div class="w-full max-w-sm space-y-4 relative z-10">
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-xl active:scale-95 transition-all shadow-lg shadow-primary/10">
                Start Session
            </button>
<div class="flex gap-4">
<button class="flex-1 py-4 bg-surface-container-highest text-on-surface font-headline font-bold rounded-xl border border-outline-variant/15 active:scale-95 transition-all">
                    Pause
                </button>
<button class="aspect-square p-4 bg-surface-container-highest text-on-surface flex items-center justify-center rounded-xl border border-outline-variant/15 active:scale-95 transition-all">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Session Metadata Bento-ish Stats -->
<div class="mt-16 grid grid-cols-2 gap-4 w-full max-w-sm">
<div class="p-4 bg-surface-container rounded-xl border border-outline-variant/5">
<p class="font-label text-[10px] text-on-surface-variant tracking-wider mb-1">COMPLETED</p>
<p class="font-headline font-bold text-xl text-on-surface">4 Sessions</p>
</div>
<div class="p-4 bg-surface-container rounded-xl border border-outline-variant/5">
<p class="font-label text-[10px] text-on-surface-variant tracking-wider mb-1">TOTAL TIME</p>
<p class="font-headline font-bold text-xl text-on-surface">1h 40m</p>
</div>
</div>
</main>
<!-- Navigation (Shared Component: BottomNavBar) -->
<!-- Active Tab: "Focus" (Index 2) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-[#0b0e11] dark:bg-[#0b0e11] border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] z-50">

<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-200 transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">grid_view</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Dashboard</span>
</a>
<!-- Vault -->
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-200 transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">inventory_2</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Vault</span>
</a>

<a class="flex flex-col items-center justify-center text-indigo-400 bg-indigo-500/10 rounded-xl px-3 py-1 active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Focus</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-200 transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Profile</span>
</a>
